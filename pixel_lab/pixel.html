<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Lab: Always Smooth</title>
    <link rel="stylesheet" href="/pixel_lab/pixel.css">
</head>

<body>
    <a href="../index_page/index.html" class="home-btn" title="На главную">Home</a>

    <button class="icon-btn btn-float" id="show-stats-btn" title="Показать информацию">i</button>
    <button class="icon-btn btn-float" id="open-controls-btn" title="Открыть настройки">⚙️</button>

    <div id="stats-overlay">
        <button class="icon-btn btn-close" id="hide-stats-btn" title="Скрыть">✕</button>
        <div class="stats-item">FPS: <span id="fps-val">0</span></div>
        <div class="stats-item">Particles: <span id="count-val">0</span></div>
        <div class="stats-item">Spawn Points: <span id="spawn-val">0</span></div>
        <div class="stats-item">Scale: <span id="scale-val">0</span></div>
    </div>

    <div id="controls">
        <div class="controls-header">
            <div style="font-weight: 900; font-size: 20px; letter-spacing: -1px;">PIXEL<span
                    style="color:var(--accent)">LAB</span></div>
            <button class="icon-btn btn-close" id="close-controls-btn" title="Скрыть панель">✕</button>
        </div>

        <div class="group">
            <div class="group-title">Визуал</div>
            <label><input type="checkbox" id="rainbowMode" checked> Эффект Радуги</label>
            <input type="color" id="particleColor" value="#4ddbff">
            <div class="group-title">Формы</div>
            <select id="sPattern">
                <option value="circle_solid">Круг</option>
                <option value="square_outline">Квадрат</option>
            </select>
        </div>

        <div class="group">
            <div class="group-title">Параметры</div>
            <label>Длина шлейфа <span class="val" id="val-trailAlpha">0.05</span></label>
            <input type="range" id="trailAlpha" min="0.01" max="0.5" step="0.01" value="0.05">

            <label>Скорость <span class="val" id="val-speed">3.5</span></label>
            <input type="range" id="speed" min="0" max="15" step="0.1" value="3.5">

            <label>Размер пикселя <span class="val" id="val-pSize">4</span></label>
            <input type="range" id="pSize" min="1" max="15" value="4">

            <label>Масштаб <span class="val" id="val-spawnScale">45</span></label>
            <input type="range" id="spawnScale" min="5" max="150" value="45">

            <label>Детализация <span class="val" id="val-spawnDensity">8</span></label>
            <input type="range" id="spawnDensity" min="1" max="20" value="8">

            <label>Время жизни <span class="val" id="val-lifeSpan">70</span></label>
            <input type="range" id="lifeSpan" min="1" max="100" step="1" value="70">
        </div>

        <div class="btn-row">
            <button class="action-btn" id="clearBtn">СБРОС</button>
            <button class="action-btn" id="saveBtn">PNG</button>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
</body>
<script src="/pixel_lab/pixel.js"></script>

</html>
